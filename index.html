<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Counter</title>
<style>
body {
  background: #003366;
  color: white;
  font-family: Arial;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
  transition: background 0.5s ease;
}
.counter { font-size: 15vw; font-weight: bold; }
.milestone { font-size: 4vw; color: gold; font-weight: bold; margin-top: 20px; min-height: 80px; }
.header { font-size: 5vw; font-weight: bold; margin-bottom: 10px; }
.subheader { font-size: 3vw; margin-bottom: 20px; }
.footer { font-size: 2vw; margin-top: 30px; font-style: italic; }
.clock { position: absolute; bottom: 20px; right: 30px; font-size: 3vw; }
.emoji { width: 60px; height: 60px; vertical-align: middle; margin: 0 10px; }
.ms-50 { background: #006400 !important; }
.ms-100 { background: #006494 !important; }
.ms-150 { background: #8B0000 !important; }
.ms-200 { background: #4B0082 !important; }
.ms-250 { background: #8B4513 !important; }
.ms-300 { background: #2F4F4F !important; }
</style>
</head>
<body>

<div class="header">
  <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f9ba.png" class="emoji">
  SAFETY FIRST
</div>
<div class="subheader">DAYS WITHOUT AN ACCIDENT</div>
<div class="counter" id="counter">0</div>
<div class="milestone" id="milestone"></div>
<div class="footer">Every day. Every person. Every job.</div>
<div class="clock" id="clock">00:00</div>

<script>
const startDate = new Date('2026-06-13T00:00:00');

const icons = {
  50: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f389.png",
  100: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3c6.png",
  150: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2b50.png",
  200: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f44f.png",
  250: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f31f.png",
  300: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f38a.png"
};

const messages = {
  50: "50 DAYS! GREAT START TEAM!",
  100: "100 DAYS! WELL DONE!",
  150: "150 DAYS! KEEP IT UP!",
  200: "200 DAYS! AMAZING!",
  250: "250 DAYS! INCREDIBLE!",
  300: "300 DAYS! LEGENDARY!"
};

function update() {
  const today = new Date();
  const days = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  
  document.getElementById('counter').textContent = days;
  
  const lastMilestone = Math.floor(days / 50) * 50;
  
  if (lastMilestone >= 50) {
    const msDiv = document.getElementById('milestone');
    const iconUrl = icons[lastMilestone] || icons[50];
    const text = messages[lastMilestone] || lastMilestone + " DAYS!";
    
    msDiv.innerHTML = '<img src="' + iconUrl + '" class="emoji"> ' + text + ' <img src="' + iconUrl + '" class="emoji">';
    
    document.body.classList.remove('ms-50', 'ms-100', 'ms-150', 'ms-200', 'ms-250', 'ms-300');
    const msClass = 'ms-' + Math.min(lastMilestone, 300);
    document.body.classList.add(msClass);
  }
  
  const hours = String(today.getHours()).padStart(2, '0');
  const minutes = String(today.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = hours + ':' + minutes;
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
