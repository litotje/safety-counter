<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Counter</title>

<style>
body {
  background: #003366;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
}

.counter {
  font-size: 15vw;
  font-weight: bold;
  line-height: 1;
}

.milestone {
  min-height: 60px;
  margin-top: 20px;
  color: #FFD700;
  font-size: 4vw;
  font-weight: bold;
}

.header {
  margin-bottom: 10px;
  font-size: 5vw;
  font-weight: bold;
}

.subheader {
  margin-bottom: 20px;
  font-size: 3vw;
}

.footer {
  margin-top: 30px;
  font-size: 2vw;
  font-style: italic;
}

.clock {
  position: absolute;
  right: 30px;
  bottom: 20px;
  font-size: 3vw;
}
</style>
</head>

<body>

<div class="header">🦺 SAFETY FIRST</div>
<div class="subheader">DAYS WITHOUT AN ACCIDENT</div>

<div class="counter" id="counter">0</div>

<div class="milestone" id="milestone"></div>

<div class="footer">Every day. Every person. Every job.</div>

<div class="clock" id="clock">00:00</div>

<script>
/*
  Vul hier de echte datum en het echte tijdstip
  van het laatste ongeval in.

  Voorbeeld:
  1 augustus 2026 om 00:00
*/
const startDate = new Date("2026-06-13T00:00:00");

/*
  Iedere 50 dagen verschijnt de laatste behaalde mijlpaal.
  De boodschap blijft zichtbaar tot de volgende mijlpaal.
*/
const messages = {
  50: "🎉 50 DAYS! GREAT START TEAM! 🎉",
  100: "🏆 100 DAYS! WELL DONE! 🏆",
  150: "⭐ 150 DAYS! KEEP IT UP! ⭐",
  200: "👏 200 DAYS! AMAZING! 👏",
  250: "🌟 250 DAYS! INCREDIBLE! 🌟",
  300: "🎊 300 DAYS! LEGENDARY! 🎊"
};

function update() {
  const now = new Date();

  const days = Math.max(
    0,
    Math.floor((now - startDate) / (1000 * 60 * 60 * 24))
  );

  document.getElementById("counter").textContent = days;

  const lastMilestone = Math.floor(days / 50) * 50;
  const milestone = document.getElementById("milestone");

  if (lastMilestone >= 50) {
    milestone.textContent =
      messages[lastMilestone] ||
      "🎊 " + lastMilestone + " DAYS! TEAM ACHIEVEMENT! 🎊";
  } else {
    milestone.textContent = "";
  }

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");

  document.getElementById("clock").textContent =
    hours + ":" + minutes;
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
