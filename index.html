<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>
<body>
<h1>HELLO WORLD!</h1>
<p>Als je dit ziet, werkt GitHub Pages!</p>
<p id="test">DAYS: 0</p>
<script>
  const accidentDate = new Date('2026-01-01T00:00:00');
  const now = new Date();
  const diffTime = now - accidentDate;
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  document.getElementById('test').innerText = "DAYS: " + diffDays;
  console.log("Days calculated:", diffDays);
</script>
</body>
</html>
