<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Counter</title>
<style>
body {
  background: #003366;
  color: white;
  font-family: Arial;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.counter { font-size: 15vw; font-weight: bold; }
.milestone { font-size: 4vw; color: gold; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>

<h1>🦺 SAFETY FIRST</h1>
<p>DAYS WITHOUT AN ACCIDENT</p>
<div class="counter" id="counter">0</div>
<div class="milestone" id="milestone"></div>

<script>
const startDate = new Date('2026-01-01');
const today = new Date();
const days = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));

document.getElementById('counter').textContent = days;

if (days % 50 === 0 && days > 0) {
  document.getElementById('milestone').textContent = '🎉 ' + days + ' DAYS! AWESOME! 🎉';
} else {
  document.getElementById('milestone').textContent = '';
}

console.log('Days:', days, 'Milestone?', days % 50 === 0);
</script>

</body>
</html>
