<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Counter</title>

<style>
body {
  background: #003366;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
}

.header {
  margin-bottom: 10px;
  font-size: 5vw;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.header-icon {
  width: 5vw;
  height: 5vw;
  min-width: 42px;
  min-height: 42px;
  max-width: 90px;
  max-height: 90px;
  object-fit: contain;
}

.subheader {
  margin-bottom: 20px;
  font-size: 3vw;
}

.counter {
  font-size: 15vw;
  font-weight: bold;
  line-height: 1;
}

.milestone {
  min-height: 80px;
  margin-top: 20px;
  color: #FFD700;
  font-size: 4vw;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

.milestone-icon {
  width: 4vw;
  height: 4vw;
  min-width: 38px;
  min-height: 38px;
  max-width: 76px;
  max-height: 76px;
  object-fit: contain;
}

.footer {
  margin-top: 30px;
  font-size: 2vw;
  font-style: italic;
}

.clock {
  position: absolute;
  right: 30px;
  bottom: 20px;
  font-size: 3vw;
}
</style>
</head>

<body>

<div class="header">
  <img
    class="header-icon"
    src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f9ba.png"
    alt="Safety vest"
  >
  <span>SAFETY FIRST</span>
</div>

<div class="subheader">DAYS WITHOUT AN ACCIDENT</div>

<div class="counter" id="counter">0</div>

<div class="milestone" id="milestone"></div>

<div class="footer">Every day. Every person. Every job.</div>

<div class="clock" id="clock">00:00</div>

<script>
/*
  Vul hier de echte datum en tijd van het laatste incident in.
  Voorbeeld: 1 augustus 2026 om 00:00.
*/
const startDate = new Date("2026-06-13T00:00:00");

/*
  Afbeeldingen en teksten voor de laatste behaalde mijlpaal.
  De boodschap blijft zichtbaar tot de volgende mijlpaal.
*/
const milestones = {
  50: {
    icon: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f389.png",
    text: "50 DAYS! GREAT START TEAM!"
  },
  100: {
    icon: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f3c6.png",
    text: "100 DAYS! WELL DONE!"
  },
  150: {
    icon: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/2b50.png",
    text: "150 DAYS! KEEP IT UP!"
  },
  200: {
    icon: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f44f.png",
    text: "200 DAYS! AMAZING!"
  },
  250: {
    icon: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f31f.png",
    text: "250 DAYS! INCREDIBLE!"
  },
  300: {
    icon: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f38a.png",
    text: "300 DAYS! LEGENDARY!"
  }
};

const defaultMilestoneIcon =
  "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/1f389.png";

function update() {
  const now = new Date();

  const days = Math.max(
    0,
    Math.floor((now - startDate) / (1000 * 60 * 60 * 24))
  );

  document.getElementById("counter").textContent = days;

  const lastMilestone = Math.floor(days / 50) * 50;
  const milestoneElement = document.getElementById("milestone");

  if (lastMilestone >= 50) {
    const milestone = milestones[lastMilestone] || {
      icon: defaultMilestoneIcon,
      text: lastMilestone + " DAYS! TEAM ACHIEVEMENT!"
    };

    milestoneElement.innerHTML =
      '<img class="milestone-icon" src="' + milestone.icon + '" alt="Milestone">' +
      '<span>' + milestone.text + '</span>' +
      '<img class="milestone-icon" src="' + milestone.icon + '" alt="Milestone">';
  } else {
    milestoneElement.innerHTML = "";
  }

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");

  document.getElementById("clock").textContent =
    hours + ":" + minutes;
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
