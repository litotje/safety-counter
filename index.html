<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days Without Accident</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #003366;
    color: #ffffff;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    transition: background-color 0.5s ease;
  }
  .header {
    font-size: 4vw;
    font-weight: bold;
    margin-bottom: 2vh;
  }
  .subheader {
    font-size: 2.5vw;
    margin-bottom: 3vh;
    font-weight: normal;
  }
  .counter {
    font-size: 12vw;
    font-weight: bold;
    line-height: 1;
    margin: 2vh 0;
  }
  .milestone-message {
    font-size: 3vw;
    margin-top: 2vh;
    font-weight: bold;
    color: #FFD700;
    animation: pulse 2s infinite;
  }
  .footer {
    font-size: 2vw;
    margin-top: 3vh;
    font-style: italic;
  }
  .clock {
    position: absolute;
    bottom: 2vh;
    right: 3vw;
    font-size: 2.5vw;
    font-weight: bold;
  }
  .trophy {
    font-size: 8vw;
    margin: 2vh 0;
    animation: bounce 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  /* Milestone background kleuren */
  .milestone-100 { background-color: #006400 !important; }
  .milestone-200 { background-color: #006494 !important; }
  .milestone-300 { background-color: #8B0000 !important; }
  .milestone-400 { background-color: #4B0082 !important; }
  .milestone-500 { background-color: #8B4513 !important; }
</style>
</head>
<body>

<div class="header">🦺 SAFETY FIRST</div>
<div class="subheader">DAYS WITHOUT AN ACCIDENT</div>
<div class="counter" id="daysCounter">0</div>
<div class="trophy" id="trophyIcon" style="display: none;">🏆</div>
<div class="milestone-message" id="milestoneMessage" style="display: none;"></div>
<div class="footer">Every day. Every person. Every job.</div>
<div class="clock" id="liveClock">00:00</div>

<script>
  // === CONFIGURATIE: pas hier de startdatum aan ===
  const accidentDate = new Date('2026-06-12T00:00:00');
  // ===============================================

  const milestoneMessages = {
    50: "🎉 100 DAYS! WELL DONE TEAM! 🎉",
    200: "🏆 200 DAYS! INCREDIBLE ACHIEVEMENT! 🏆",
    300: "⭐ 300 DAYS! WORLD CLASS SAFETY! ⭐",
    400: "👏 400 DAYS! OUTSTANDING COMMITMENT! 👏",
    500: "🌟 500 DAYS! LEGENDARY SAFETY RECORD! 🌟"
  };

  function checkMilestone(days) {
    const trophy = document.getElementById('trophyIcon');
    const message = document.getElementById('milestoneMessage');
    const body = document.body;
    
    // Verwijder alle milestone classes
    body.classList.remove('milestone-100', 'milestone-200', 'milestone-300', 'milestone-400', 'milestone-500');
    
    // Check of het een milestone is (elke 100 dagen)
    if (days > 0 && days % 100 === 0) {
      trophy.style.display = 'block';
      message.style.display = 'block';
      
      // Specifieke boodschap voor bekende milestones
      if (milestoneMessages[days]) {
        message.innerText = milestoneMessages[days];
      } else {
        message.innerText = `🎊 ${days} DAYS! AMAZING TEAM EFFORT! 🎊`;
      }
      
      // Voeg speciale achtergrondkleur toe
      body.classList.add(`milestone-${Math.min(Math.floor(days/100)*100, 500)}`);
    } else {
      trophy.style.display = 'none';
      message.style.display = 'none';
    }
  }

  function updateCounter() {
    const now = new Date();
    const diffTime = now - accidentDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    document.getElementById('daysCounter').innerText = diffDays;
    
    // Check op milestones
    checkMilestone(diffDays);
  }

  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('liveClock').innerText = hours + ':' + minutes;
  }

  updateCounter();
  updateClock();
  setInterval(updateCounter, 60000);
  setInterval(updateClock, 1000);
</script>

</body>
</html>
