<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Cross</title>
<style>
body {
  background: #003366;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
}
.header {
  font-size: 4vw;
  font-weight: bold;
  margin-bottom: 20px;
}
.crosses-container {
  display: flex;
  gap: 30px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
}
.cross {
  display: grid;
  grid-template-columns: repeat(7, 50px);
  grid-template-rows: repeat(7, 50px);
  gap: 4px;
}
.cell {
  width: 50px;
  height: 50px;
  background: #22c55e;
  border-radius: 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  font-weight: bold;
  color: white;
}
.cell.red {
  background: #ef4444;
}
.cell.empty {
  background: transparent;
}
.cell.center {
  background: #003366;
  color: #FFD700;
  font-size: 14px;
}
.month-title {
  font-size: 24px;
  font-weight: bold;
  color: #FFD700;
  margin-bottom: 15px;
  text-align: center;
}
.cross-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.legend {
  margin-top: 30px;
  display: flex;
  gap: 30px;
  font-size: 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.legend-box {
  width: 30px;
  height: 30px;
  border-radius: 5px;
}
.legend-box.green { background: #22c55e; }
.legend-box.red { background: #ef4444; }
.footer {
  margin-top: 20px;
  font-size: 16px;
  font-style: italic;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="header">🦺 SAFETY CROSS - LAST 3 MONTHS</div>

<div id="crossesContainer" class="crosses-container"></div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-box green"></div>
    <span>No Accidents</span>
  </div>
  <div class="legend-item">
    <div class="legend-box red"></div>
    <span>Accident Reported</span>
  </div>
</div>

<div class="footer">Every day without an accident is a team achievement</div>

<script>
// === CONFIGURATIE: Pas hier accident dagen aan ===
const accidentDays = [
  // Voorbeeld: 15 januari 2026
  // { year: 2026, month: 0, day: 15 },
];
// ==========================================

const dayLabels = ["M", "T", "W", "T", "F", "S", "S"];

function isAccidentDay(year, month, day) {
  return accidentDays.some(acc => 
    acc.year === year && acc.month === month && acc.day === day
  );
}

function getDaysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function createCross(year, month) {
  const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", 
                      "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  
  const daysInMonth = getDaysInMonth(year, month);
  const firstDay = new Date(year, month, 1).getDay();
  const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
  
  let html = `
    <div class="cross-wrapper">
      <div class="month-title">${monthNames[month]} ${year}</div>
      <div class="cross">
  `;
  
  // Row 1: Day labels
  dayLabels.forEach(label => {
    html += `<div class="cell" style="color: #FFD700; background: #003366;">${label}</div>`;
  });
  
  // Row 2-7: Days
  let day = 1;
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 7; col++) {
      if ((row === 0 && col < adjustedFirstDay) || day > daysInMonth) {
        html += `<div class="cell empty"></div>`;
      } else if (day <= daysInMonth) {
        const isAccident = isAccidentDay(year, month, day);
        const className = isAccident ? 'cell red' : 'cell';
        html += `<div class="${className}">${day}</div>`;
        day++;
      }
    }
  }
  
  html += `
      </div>
    </div>
  `;
  
  return html;
}

function createSafetyCross() {
  const today = new Date();
  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();
  
  const months = [];
  
  // Get last 3 months (current month + 2 months before)
  for (let i = 2; i >= 0; i--) {
    let month = currentMonth - i;
    let year = currentYear;
    
    if (month < 0) {
      month += 12;
      year--;
    }
    
    months.push({ year, month });
  }
  
  const container = document.getElementById('crossesContainer');
  container.innerHTML = months.map(m => createCross(m.year, m.month)).join('');
}

createSafetyCross();
setInterval(createSafetyCross, 3600000); // Update every hour
</script>

</body>
</html>
