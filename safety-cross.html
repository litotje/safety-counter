<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Cross</title>
<style>
body {
  background: #003366;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
}
.header {
  font-size: 4vw;
  font-weight: bold;
  margin-bottom: 20px;
}
.crosses-container {
  display: flex;
  gap: 40px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.cross-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.month-title {
  font-size: 20px;
  font-weight: bold;
  color: #FFD700;
  margin-bottom: 15px;
  text-align: center;
}
.cross {
  position: relative;
  width: 280px;
  height: 280px;
}
.segment {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 14px;
  font-weight: bold;
  color: white;
  transform: translate(-50%, -50%);
}
.segment.green {
  background: #22c55e;
}
.segment.red {
  background: #ef4444;
}
.segment.white {
  background: #ffffff;
  color: #003366;
}
.segment.today {
  border: 3px solid #FFD700;
}
.legend {
  margin-top: 30px;
  display: flex;
  gap: 30px;
  font-size: 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.legend-box {
  width: 30px;
  height: 30px;
  border-radius: 50%;
}
.legend-box.green { background: #22c55e; }
.legend-box.red { background: #ef4444; }
.legend-box.white { background: #ffffff; }
.footer {
  margin-top: 20px;
  font-size: 16px;
  font-style: italic;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="header">🦺 SAFETY CROSS - LAST 3 MONTHS</div>

<div id="crossesContainer" class="crosses-container"></div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-box green"></div>
    <span>No Accidents</span>
  </div>
  <div class="legend-item">
    <div class="legend-box red"></div>
    <span>Accident Reported</span>
  </div>
  <div class="legend-item">
    <div class="legend-box white"></div>
    <span>Future Days</span>
  </div>
</div>

<div class="footer">Every day without an accident is a team achievement</div>

<script>
// === CONFIGURATIE: Pas hier accident dagen aan ===
const accidentDays = [
  // Voorbeeld: 20 augustus 2026
  // { year: 2026, month: 7, day: 20 },
];
// ==========================================

function isAccidentDay(year, month, day) {
  return accidentDays.some(acc => 
    acc.year === year && acc.month === month && acc.day === day
  );
}

function getDaysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function createCross(year, month) {
  const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", 
                      "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  
  const daysInMonth = getDaysInMonth(year, month);
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
  const todayDay = today.getDate();
  
  let html = `
    <div class="cross-wrapper">
      <div class="month-title">${monthNames[month]} ${year}</div>
      <div class="cross">
  `;
  
  const centerX = 140;
  const centerY = 140;
  const radius = 100;
  const startAngle = -90; // Start at top (12 o'clock)
  
  for (let day = 1; day <= daysInMonth; day++) {
    const angle = startAngle + (360 / daysInMonth) * (day - 1);
    const radian = angle * Math.PI / 180;
    const x = centerX + radius * Math.cos(radian);
    const y = centerY + radius * Math.sin(radian);
    
    let className = 'segment';
    
    if (isAccidentDay(year, month, day)) {
      className += ' red';
    } else if (isCurrentMonth && day > todayDay) {
      className += ' white';
    } else if (isCurrentMonth && day === todayDay) {
      className += ' green today';
    } else {
      className += ' green';
    }
    
    html += `<div class="${className}" style="left: ${x}px; top: ${y}px;">${day}</div>`;
  }
  
  html += `
      </div>
    </div>
  `;
  
  return html;
}

function createSafetyCross() {
  const today = new Date();
  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();
  
  const months = [];
  
  // Get last 3 months (current month + 2 months before)
  for (let i = 2; i >= 0; i--) {
    let month = currentMonth - i;
    let year = currentYear;
    
    if (month < 0) {
      month += 12;
      year--;
    }
    
    months.push({ year, month });
  }
  
  const container = document.getElementById('crossesContainer');
  container.innerHTML = months.map(m => createCross(m.year, m.month)).join('');
}

createSafetyCross();
setInterval(createSafetyCross, 3600000);
</script>

</body>
</html>
