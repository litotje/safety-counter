<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Cross</title>
<style>
body {
  background: #003366;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
}
.header {
  font-size: 3vw;
  font-weight: bold;
  margin-bottom: 15px;
}
.crosses-container {
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}
.cross-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.month-title {
  font-size: 16px;
  font-weight: bold;
  color: #FFD700;
  margin-bottom: 10px;
  text-align: center;
}
.cross {
  position: relative;
  width: 180px;
  height: 180px;
}
.segment {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 3px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 10px;
  font-weight: bold;
  color: white;
  transform: translate(-50%, -50%);
}
.segment.green {
  background: #22c55e;
}
.segment.red {
  background: #ef4444;
}
.segment.white {
  background: #ffffff;
  color: #003366;
}
.segment.today {
  border: 2px solid #FFD700;
  box-sizing: border-box;
}
.legend {
  margin-top: 20px;
  display: flex;
  gap: 20px;
  font-size: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-box {
  width: 20px;
  height: 20px;
  border-radius: 3px;
}
.legend-box.green { background: #22c55e; }
.legend-box.red { background: #ef4444; }
.legend-box.white { background: #ffffff; }
.footer {
  margin-top: 15px;
  font-size: 12px;
  font-style: italic;
  opacity: 0.8;
}
</style>
</head>
<body>

<div class="header">🦺 SAFETY CROSS - LAST 3 MONTHS</div>

<div id="crossesContainer" class="crosses-container"></div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-box green"></div>
    <span>No Accidents</span>
  </div>
  <div class="legend-item">
    <div class="legend-box red"></div>
    <span>Accident</span>
  </div>
  <div class="legend-item">
    <div class="legend-box white"></div>
    <span>Future</span>
  </div>
</div>

<div class="footer">Every day without an accident is a team achievement</div>

<script>
const accidentDays = [
  { year: 2026, month: 5, day: 13 },
];

function isAccidentDay(year, month, day) {
  return accidentDays.some(acc => 
    acc.year === year && acc.month === month && acc.day === day
  );
}

function getDaysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function createCross(year, month) {
  const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", 
                      "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  
  const daysInMonth = getDaysInMonth(year, month);
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
  const todayDay = today.getDate();
  
  let html = `
    <div class="cross-wrapper">
      <div class="month-title">${monthNames[month]} ${year}</div>
      <div class="cross">
  `;
  
  const centerX = 90;
  const centerY = 90;
  const spacing = 24;
  
  for (let day = 1; day <= daysInMonth; day++) {
    let x, y;
    
    if (day <= 7) {
      x = centerX;
      y = centerY - spacing * (7 - day);
    } else if (day <= 14) {
      x = centerX + spacing * (day - 7);
      y = centerY;
    } else if (day <= 21) {
      x = centerX;
      y = centerY + spacing * (day - 14);
    } else if (day <= 28) {
      x = centerX - spacing * (day - 21);
      y = centerY;
    } else {
      const extra = day - 28;
      x = centerX + spacing * (extra - 2);
      y = centerY + spacing;
    }
    
    let className = 'segment';
    
    if (isAccidentDay(year, month, day)) {
      className += ' red';
    } else if (isCurrentMonth && day > todayDay) {
      className += ' white';
    } else if (isCurrentMonth && day === todayDay) {
      className += ' green today';
    } else {
      className += ' green';
    }
    
    html += `<div class="${className}" style="left: ${x}px; top: ${y}px;">${day}</div>`;
  }
  
  html += `
      </div>
    </div>
  `;
  
  return html;
}

function createSafetyCross() {
  const today = new Date();
  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();
  
  const months = [];
  
  for (let i = 2; i >= 0; i--) {
    let month = currentMonth - i;
    let year = currentYear;
    
    if (month < 0) {
      month += 12;
      year--;
    }
    
    months.push({ year, month });
  }
  
  const container = document.getElementById('crossesContainer');
  container.innerHTML = months.map(m => createCross(m.year, m.month)).join('');
}

createSafetyCross();
setInterval(createSafetyCross, 3600000);
</script>

</body>
</html>
