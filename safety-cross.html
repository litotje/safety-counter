<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Cross</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #003366;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

.page-title {
  text-align: center;
  font-size: clamp(20px, 3vw, 42px);
  margin: 0 0 16px;
  font-weight: 700;
}

.crosses {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(12px, 2vw, 32px);
  width: 100%;
}

.month-card {
  flex: 1 1 0;
  min-width: 0;
  max-width: 430px;
}

.month-title {
  text-align: center;
  font-size: clamp(14px, 1.8vw, 26px);
  font-weight: 700;
  margin-bottom: 8px;
  text-transform: uppercase;
  color: #FFD700;
}

.cross-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding-bottom: 15%;
}

.day {
  position: absolute;
  width: 12.5%;
  height: 12.5%;
  border: 1px solid #777777;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  color: #111111;
  font-size: clamp(11px, 1.5vw, 24px);
  font-weight: 700;
}

.day.green {
  background: #70bf50;
  color: #111111;
}

.day.red {
  background: #ed1b35;
  color: #ffffff;
}

.day.future {
  background: #ffffff;
  color: #111111;
}

/* Bovenste deel */
.day-1  { left: 37.5%; top: 0%; }
.day-2  { left: 50%;   top: 0%; }
.day-3  { left: 37.5%; top: 12.5%; }
.day-4  { left: 50%;   top: 12.5%; }
.day-5  { left: 37.5%; top: 25%; }
.day-6  { left: 50%;   top: 25%; }
.day-7  { left: 37.5%; top: 37.5%; }
.day-8  { left: 50%;   top: 37.5%; }

/* Middenstuk */
.day-9  { left: 0%;    top: 50%; }
.day-10 { left: 12.5%; top: 50%; }
.day-11 { left: 25%;   top: 50%; }
.day-12 { left: 37.5%; top: 50%; }
.day-13 { left: 50%;   top: 50%; }
.day-14 { left: 62.5%; top: 50%; }
.day-15 { left: 75%;   top: 50%; }
.day-16 { left: 87.5%; top: 50%; }

.day-17 { left: 0%;    top: 62.5%; }
.day-18 { left: 12.5%; top: 62.5%; }
.day-19 { left: 25%;   top: 62.5%; }
.day-20 { left: 37.5%; top: 62.5%; }
.day-21 { left: 50%;   top: 62.5%; }
.day-22 { left: 62.5%; top: 62.5%; }
.day-23 { left: 75%;   top: 62.5%; }
.day-24 { left: 87.5%; top: 62.5%; }

/* Onderste deel */
.day-25 { left: 37.5%; top: 75%; }
.day-26 { left: 50%;   top: 75%; }
.day-27 { left: 37.5%; top: 87.5%; }
.day-28 { left: 50%;   top: 87.5%; }
.day-29 { left: 37.5%; top: 100%; }
.day-30 { left: 50%;   top: 100%; }
.day-31 { left: 37.5%; top: 112.5%; }

/* Vaste zone onderaan het scherm */
.bottom-area {
  position: fixed;
  left: 0;
  bottom: 24px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

.legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  color: #ffffff;
  font-size: clamp(11px, 1.3vw, 18px);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-box {
  width: 18px;
  height: 18px;
  border: 1px solid #ffffff;
}

.legend-box.green {
  background: #70bf50;
}

.legend-box.red {
  background: #ed1b35;
}

.legend-box.future {
  background: #ffffff;
}

.info {
  text-align: center;
  margin-top: 15px;
  color: #ffffff;
  font-size: clamp(11px, 1.3vw, 18px);
  opacity: 0.9;
}
</style>
</head>
